[project]
name = "nodestep"
version = "0.1.0a1"
description = "Explicit, async-first graph framework for LLM agents (alpha)"
authors = [
  {name = 'Marek Filo', email = 'mrf.software@pm.me'}
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["agents", "asyncio", "graph", "llm", "openai", "pydantic", "workflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.12.5,<3",
    "typing-extensions>=4.14.1,<5",
]

[project.urls]
Homepage = "https://github.com/nodestep-ai/nodestep"
Source = "https://github.com/nodestep-ai/nodestep"
Documentation = "https://nodestep-ai.github.io/nodestep"
Changelog = "https://github.com/nodestep-ai/nodestep/blob/main/CHANGELOG.md"
Issues = "https://github.com/nodestep-ai/nodestep/issues"

[project.optional-dependencies]
openai = [
    "openai>=2.11,<4",
    "pydantic-settings>=2.13.1,<3",
]
sandbox = [
    "jinja2>=3.1.6,<4",
    "starlette>=1.6,<2",
    "typer>=0.27.2,<1",
    "uvicorn>=0.53,<1",
]
all = ["nodestep[openai,sandbox]"]

[project.scripts]
nodestep = "nodestep_sandbox.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nodestep", "src/nodestep_sandbox"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "examples", "CHANGELOG.md"]
exclude = ["tests/docs", "tests/design"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "ruff==0.16.9",
    "ty==0.0.84",
]
docs = [
    "mkdocs-material==9.7.7",
    "mkdocstrings==1.0.6",
    "mkdocstrings-python==2.0.9",
]

[tool.ty.src]
exclude = ["overrides/", "tests/docs/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--import-mode=importlib"]
filterwarnings = ["error"]
