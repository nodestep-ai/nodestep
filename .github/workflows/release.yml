name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: GitHub release
    if: github.event.workflow_run.conclusion == 'success' && contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Read the version from CHANGELOG.md
        id: version
        run: |
          version=$(sed -nE 's/^## \[([0-9][^]]*)\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$/\1/p' CHANGELOG.md | head -n 1)
          test -n "$version" || { echo "CHANGELOG.md has no released version yet" >&2; exit 1; }
          project=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$version" = "$project" || { echo "CHANGELOG.md is at $version, pyproject.toml at $project" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh api "repos/$GH_REPO/git/ref/tags/v$version" --silent 2>/dev/null; then
            echo "v$version is already released."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: steps.version.outputs.new == 'true'
        with:
          version: "0.12.17"
          python-version: "3.12"
          enable-cache: false
      - name: Build
        if: steps.version.outputs.new == 'true'
        run: uv build
      - name: Write the release notes
        if: steps.version.outputs.new == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "CHANGELOG.md has no notes for $VERSION" >&2; exit 1; }
          printf '\nFull changelog: https://github.com/%s/blob/v%s/CHANGELOG.md\n' "$GH_REPO" "$VERSION" >> notes.md
      - name: Create the tag and the GitHub release
        if: steps.version.outputs.new == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=""
          case "$VERSION" in *[a-z]*) prerelease="--prerelease" ;; esac
          gh release create "v$VERSION" dist/* --target "$COMMIT" --title "v$VERSION" --notes-file notes.md $prerelease
